# type->string: the widget type
# props->object: the props of the widget
#   the prop may also be a component(type+props)
type: line
props:
  children:
    - type: text
      props:
        value: hello this is header
        styles:
          - BOLD
          - ITALLIC
          - UNDERLINE
          - CROSS
          - CODE
          - COLOR: RED
    - type: comment
      props:
        expand: true
        comments:
          - time: 2019-1-1 11:22:23
            name: yuankui
            content: "hello kitty"
          - time: 2019-1-1 11:22:23
            name: yuankui
            content: "hello kitty"
        children:
          - type: text
            props:
              value: 争议部分
    - type: link
      props:
        href: http://yuankui.me
        children:
          - type: text
            props:
              value: click me!
    - type: mention
      props:
        id: yuankui
        name: 袁奎